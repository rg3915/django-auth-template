{% extends 'base.html' %}

{% block content %}
  <article>
    {% if validlink %}
      <h2>Senha nova</h2>
      {% include 'registration/_form.html' with button='Salvar senha' %}
    {% else %}
      <h2>Link inválido</h2>
      <p>Este link já foi usado ou expirou.</p>
      <a href="{% url 'password_reset' %}">Pedir um link novo</a>
    {% endif %}
  </article>
{% endblock %}
